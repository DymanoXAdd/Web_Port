<!DOCTYPE html>
<!--
  CONCEPT 2 — SPOTLIGHT / COVERFLOW (Hover Gallery)
  Pure HTML/CSS concept. No images — numbered squares only.
  Idea: all items stay the same size and visible. Hover one → it scales up
  and lifts forward; every other item dims + blurs + shrinks slightly.
  Keeps the whole set in view at once; "spotlights" the focused project.
  Maps to Projects: square = project image; caption = title. Click would open linkToBuild.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concept 2 — Spotlight / Coverflow</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at 50% 30%, #16161a, #060608);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    gap: 28px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .hint { color: #888; font-size: 13px; }

  .gallery {
    display: flex;
    gap: 22px;
    padding: 40px;
    perspective: 1200px;
  }

  .card {
    position: relative;
    width: 150px;
    height: 200px;
    border-radius: 18px;
    background: linear-gradient(145deg, #26262b, #1a1a1e);
    border: 1px solid #34343a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    font-weight: 800;
    color: #4a4a52;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 0.4s ease, opacity 0.4s ease, box-shadow 0.4s ease, color 0.4s ease;
  }

  /* when the row is hovered, push everything back/dim... */
  .gallery:hover .card {
    filter: blur(2px) brightness(0.6);
    transform: scale(0.92);
    opacity: 0.7;
  }
  /* ...except the one actually under the cursor — bring it forward */
  .gallery .card:hover {
    filter: none;
    transform: scale(1.18) translateY(-10px);
    opacity: 1;
    color: #fff;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.15);
    z-index: 2;
  }

  .caption {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #ccc;
    opacity: 0;
    transition: opacity 0.3s ease 0.1s;
  }
  .card:hover .caption { opacity: 1; }
</style>
</head>
<body>
  <h1>Concept 2 — Spotlight / Coverflow</h1>
  <p class="hint">Hover a square — it pops forward, the rest blur back. Best when you want all projects visible at once.</p>

  <div class="gallery">
    <div class="card">1<span class="caption">Project 1</span></div>
    <div class="card">2<span class="caption">Project 2</span></div>
    <div class="card">3<span class="caption">Project 3</span></div>
    <div class="card">4<span class="caption">Project 4</span></div>
    <div class="card">5<span class="caption">Project 5</span></div>
  </div>
</body>
</html>
