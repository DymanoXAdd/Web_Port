<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>(C) Skills Concept 2 — Infinite Marquee</title>
<style>
  :root { --bg:#0a0a0a; --fg:#fafafa; --muted:#888; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         overflow-x:hidden; }
  header { text-align:center; padding:40px 20px 6px; }
  h1 { margin:0; font-size:28px; letter-spacing:-0.02em; }
  .sub { color:var(--muted); font-size:14px; margin-top:6px; }
  .bar { text-align:center; margin:14px 0 34px; }
  button { background:#fff; color:#000; border:0; border-radius:999px;
           padding:9px 20px; font-weight:600; cursor:pointer; font-size:14px; }
  button:hover { opacity:.85; }

  .marquee { position:relative; width:100%; overflow:hidden; padding:10px 0;
             -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
             mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent); }
  .track { display:flex; gap:18px; width:max-content;
           animation:scroll 26s linear infinite; }
  .track.rev { animation-direction:reverse; animation-duration:32s; }
  .marquee:hover .track { animation-play-state:paused; }
  @keyframes scroll { to { transform:translateX(-50%); } }

  .pill { display:flex; align-items:center; gap:12px;
          background:#141414; border:1px solid #262626; border-radius:999px;
          padding:10px 18px 10px 10px; white-space:nowrap;
          transition:transform .25s ease, border-color .25s ease, background .25s ease; }
  .pill:hover { transform:translateY(-4px); border-color:#fff; background:#1c1c1c; }
  .dot { width:42px; height:42px; border-radius:50%; flex:0 0 42px;
         background:#222; border:1px solid #333; color:#ddd;
         display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
  .pname { font-size:15px; font-weight:600; }
  .ppct  { font-size:12px; color:#000; background:#fff; font-weight:700;
           padding:2px 9px; border-radius:999px; }
  .rows { display:flex; flex-direction:column; gap:22px; padding-bottom:60px; }
</style>
</head>
<body>
  <header>
    <h1>Skills</h1>
    <div class="sub">Concept 2 — Infinite Marquee (always moving; hover a row to pause)</div>
  </header>
  <div class="bar"><button id="restart">↻ Restart motion</button></div>

  <div class="rows">
    <div class="marquee"><div class="track" id="rowA"></div></div>
    <div class="marquee"><div class="track rev" id="rowB"></div></div>
  </div>

<script>
  const ROW_A = [["SQL",90,"S"],["TypeScript",80,"TS"],["React",78,"R"],["Next.js",75,"N"]];
  const ROW_B = [["Python",70,"Py"],["Tailwind",82,"Tw"],["Sanity",65,"Sa"],["Node",72,"No"]];

  function pill([name,prog,label]) {
    return `<div class="pill">
      <div class="dot">${label}</div>
      <span class="pname">${name}</span>
      <span class="ppct">${prog}%</span>
    </div>`;
  }
  function fill(el, data) {
    // duplicate the set so the -50% scroll loops seamlessly
    el.innerHTML = (data.map(pill).join("")).repeat(2);
  }
  fill(document.getElementById("rowA"), ROW_A);
  fill(document.getElementById("rowB"), ROW_B);

  // "restart" just re-triggers the CSS animation so Luis can preview the loop reset
  document.getElementById("restart").addEventListener("click", () => {
    document.querySelectorAll(".track").forEach(t => {
      t.style.animation = "none"; void t.getBoundingClientRect();
      t.style.animation = "";
    });
  });
</script>
</body>
</html>
