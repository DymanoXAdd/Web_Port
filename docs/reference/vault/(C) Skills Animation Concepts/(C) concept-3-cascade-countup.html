<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>(C) Skills Concept 3 — Staggered Cascade + Count-Up</title>
<style>
  :root { --bg:#0a0a0a; --fg:#fafafa; --muted:#888; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { text-align:center; padding:40px 20px 10px; }
  h1 { margin:0; font-size:28px; letter-spacing:-0.02em; }
  .sub { color:var(--muted); font-size:14px; margin-top:6px; }
  .bar { text-align:center; margin:14px 0 30px; }
  button { background:#fff; color:#000; border:0; border-radius:999px;
           padding:9px 20px; font-weight:600; cursor:pointer; font-size:14px; }
  button:hover { opacity:.85; }

  .grid { max-width:900px; margin:0 auto; padding:0 20px 60px;
          display:grid; grid-template-columns:repeat(4,1fr); gap:26px 20px; }
  @media (max-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); } }

  .card { background:#131313; border:1px solid #242424; border-radius:18px;
          padding:18px 14px 16px; display:flex; flex-direction:column;
          align-items:center; gap:12px;
          opacity:0; transform:translateY(26px) scale(.9);
          transition:transform .6s cubic-bezier(.16,1,.3,1), opacity .6s ease, border-color .25s ease; }
  .play .card { opacity:1; transform:none; }
  .card:hover { border-color:#fff; }

  .dot { width:64px; height:64px; border-radius:50%;
         background:#1d1d1d; border:1px solid #333; color:#eee;
         display:flex; align-items:center; justify-content:center;
         font-size:20px; font-weight:700;
         transition:transform .3s ease; }
  .card:hover .dot { transform:scale(1.08) rotate(-4deg); }
  .name { font-size:14px; font-weight:600; }
  .num  { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; }
  .meter { width:100%; height:6px; background:#222; border-radius:999px; overflow:hidden; }
  .fill  { height:100%; width:0; background:#fafafa; border-radius:999px;
           transition:width 1.1s cubic-bezier(.16,1,.3,1); }
  .play .fill { transition-delay:.15s; }
</style>
</head>
<body>
  <header>
    <h1>Skills</h1>
    <div class="sub">Concept 3 — Staggered Cascade + Count-Up (replays on every entry)</div>
  </header>
  <div class="bar"><button id="replay">↻ Replay animation</button></div>

  <div class="grid" id="grid"></div>

<script>
  const SKILLS = [
    ["SQL",90,"S"],["TypeScript",80,"TS"],["React",78,"R"],["Next.js",75,"N"],
    ["Python",70,"Py"],["Tailwind",82,"Tw"],["Sanity",65,"Sa"],["Node",72,"No"],
  ];
  const grid = document.getElementById("grid");

  SKILLS.forEach(([name,prog,label], i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.transitionDelay = (i*0.07)+"s";
    card.innerHTML = `
      <div class="dot">${label}</div>
      <div class="name">${name}</div>
      <div class="num" data-prog="${prog}">0%</div>
      <div class="meter"><div class="fill" data-prog="${prog}" style="transition-delay:${0.15+i*0.07}s"></div></div>`;
    grid.appendChild(card);
  });

  let timers = [];
  function countUp(el, target, delay) {
    let start = null, dur = 1100;
    const tick = (t) => {
      if (!start) start = t;
      const p = Math.min((t-start)/dur, 1);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(eased*target) + "%";
      if (p < 1) requestAnimationFrame(tick);
    };
    timers.push(setTimeout(()=>requestAnimationFrame(tick), delay));
  }

  function animate() {
    timers.forEach(clearTimeout); timers = [];
    grid.classList.remove("play");
    grid.querySelectorAll(".fill").forEach(f => f.style.width = "0");
    grid.querySelectorAll(".num").forEach(n => n.textContent = "0%");
    void grid.getBoundingClientRect(); // reflow → replay
    grid.classList.add("play");
    grid.querySelectorAll(".fill").forEach((f,i) => {
      f.style.width = f.dataset.prog + "%";
    });
    grid.querySelectorAll(".num").forEach((n,i) => {
      countUp(n, +n.dataset.prog, 150 + i*70);
    });
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e => { if (e.isIntersecting) animate(); });
  }, { threshold:0.35 });
  io.observe(grid);

  document.getElementById("replay").addEventListener("click", animate);
  animate();
</script>
</body>
</html>
